name: Daily GitHub Monitor

on:
  schedule:
    # 06:00 UTC = 08:00 Paris (CEST)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Generate a report and email even when nothing changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: write    # Read/write state on data branch
  issues: write      # Create daily report issues

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout state from data branch
        run: |
          git fetch origin data || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- state.json || echo '{}' > state.json
          else
            echo '{}' > state.json
          fi

      - name: Create daily-report label if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "daily-report" --description "Automated daily monitor reports" --color "0e8a16" --repo "${{ github.repository }}" 2>/dev/null || true

      - name: Run monitoring script
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FORCE_REPORT: ${{ inputs.force_report || 'false' }}
        shell: pwsh
        run: |
          Remove-Item "report.json" -ErrorAction SilentlyContinue
          $parameters = @{
            PreviousStateJson = "state.json"
            OutputStateJson = "state.json"
            RepoName = "${{ github.repository }}"
            ReportJsonPath = "report.json"
          }
          if ($env:FORCE_REPORT -eq "true") {
            $parameters.ForceReport = $true
          }
          ./Scripts/Check-GitHubChanges.ps1 @parameters

      - name: Detect report
        id: report
        shell: bash
        run: |
          if [ -s report.json ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send report email
        if: steps.report.outputs.has_report == 'true'
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import smtplib
          import ssl
          from datetime import datetime, timezone
          from email.message import EmailMessage
          from html import escape

          password = os.environ.get("GMAIL_APP_PASSWORD", "").replace(" ", "")
          if not password:
              raise SystemExit("GMAIL_APP_PASSWORD secret is missing.")

          with open("report.json", encoding="utf-8-sig") as report_file:
              report = json.load(report_file)

          recipient = "fabrice.r@gmail.com"
          changes = report.get("changes", {})
          branches = changes.get("branches", [])
          open_prs = changes.get("open_prs", [])
          stale_branches = changes.get("stale_merged_branches", [])
          summary = report.get("summary", {})

          def count(key, items):
              return int(summary.get(key, len(items)))

          def text(value):
              return escape(str(value if value not in (None, "") else "—"), quote=True)

          def link(url, label):
              if not url:
                  return text(label)
              return f'<a href="{escape(str(url), quote=True)}" style="color:#2563eb;text-decoration:none;font-weight:700;">{text(label)}</a>'

          def pull_request_link(item):
              return link(item.get("url"), "PR #" + str(item.get("number", "—")))

          def format_utc(value):
              if not value:
                  return "—"
              try:
                  timestamp = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return timestamp.astimezone(timezone.utc).strftime("%d/%m/%Y %H:%M UTC")
              except ValueError:
                  return text(value)

          def report_date(value):
              months = ("janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre")
              try:
                  timestamp = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return f"{timestamp.day} {months[timestamp.month - 1]} {timestamp.year}"
              except ValueError:
                  return str(value)[:10]

          def email_cell(content):
              return f'<td align="center" style="padding:10px 8px;border-bottom:1px solid #e2e8f0;color:#334155;font-size:12px;line-height:18px;text-align:center;vertical-align:middle;word-break:break-word;">{content}</td>'

          def code_label(value):
              return f'<span style="display:inline-block;background:#eff6ff;border:1px solid #bfdbfe;border-radius:5px;padding:3px 6px;color:#1e3a8a;font-family:Consolas,monospace;font-size:11px;line-height:15px;">{text(value)}</span>'

          def section(title, subtitle, headers, rows):
              if not rows:
                  return ""
              header_html = "".join(f'<th align="center" style="padding:10px 8px;background:#eff6ff;border-bottom:1px solid #bfdbfe;color:#1e3a8a;font-size:11px;font-weight:700;letter-spacing:0.3px;text-align:center;text-transform:uppercase;">{text(header)}</th>' for header in headers)
              return f"""
              <tr><td style="padding:12px 28px 0;">
                <table role="presentation" width="100%" align="center" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #dbeafe;border-radius:10px;background:#ffffff;">
                  <tr><td align="center" style="padding:18px 18px 12px;background:#f8fbff;border-bottom:1px solid #dbeafe;">
                    <div style="color:#1e3a8a;font-size:17px;font-weight:700;line-height:22px;text-align:center;">{text(title)}</div>
                    <div style="margin-top:5px;color:#64748b;font-size:12px;line-height:18px;text-align:center;">{text(subtitle)}</div>
                  </td></tr>
                  <tr><td style="padding:0;">
                    <table role="presentation" width="100%" align="center" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
                      <thead><tr>{header_html}</tr></thead><tbody>{''.join(rows)}</tbody>
                    </table>
                  </td></tr>
                </table>
              </td></tr>"""

          def stat_card(value, label, colour):
              return f"""<td width="33%" align="center" style="padding:4px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e2e8f0;border-top:4px solid {colour};border-radius:10px;background:#f8fafc;"><tr><td align="center" style="padding:14px 8px 12px;text-align:center;"><div style="color:#0f172a;font-size:27px;font-weight:700;line-height:30px;">{value}</div><div style="margin-top:6px;color:#64748b;font-size:11px;font-weight:600;line-height:15px;text-align:center;">{text(label)}</div></td></tr></table></td>"""

          branch_count = count("unmerged_branch_count", branches)
          pr_count = count("open_pr_count", open_prs)
          stale_count = count("stale_merged_branch_count", stale_branches)
          display_date = report_date(report.get("generated_at", ""))

          branch_rows = [
              f"<tr>{email_cell(text(item.get('repo')))}{email_cell(code_label(item.get('branch')))}{email_cell(text(item.get('owner')))}{email_cell(text(item.get('purpose')))}</tr>"
              for item in branches
          ]
          pr_rows = [
              f"<tr>{email_cell(text(item.get('repo')))}{email_cell(pull_request_link(item))}{email_cell(text(item.get('title')))}{email_cell(text(item.get('author')))}{email_cell(format_utc(item.get('created_at')))}</tr>"
              for item in open_prs
          ]
          stale_rows = [
              f"<tr>{email_cell(text(item.get('repo')))}{email_cell(code_label(item.get('head_branch')))}{email_cell(pull_request_link(item))}{email_cell(text(item.get('title')))}{email_cell(text(item.get('author')))}{email_cell(format_utc(item.get('merged_at')))}</tr>"
              for item in stale_branches
          ]

          sections = "".join([
              section("Branches non fusionnées", "Ces branches ne sont pas entièrement intégrées à la branche par défaut.", ["Dépôt", "Branche", "Auteur", "Objet"], branch_rows),
              section("Pull requests ouvertes", "Ces PR sont toujours en attente de fusion ou de fermeture.", ["Dépôt", "PR", "Titre", "Auteur", "Créée le"], pr_rows),
              section("Branches fusionnées à supprimer", "Ces branches proviennent de PR fusionnées et peuvent être nettoyées.", ["Dépôt", "Branche", "PR", "Objet", "Auteur", "Fusionnée le"], stale_rows),
          ])

          issue_button = ""
          if report.get("issue_url"):
              issue_url = escape(str(report["issue_url"]), quote=True)
              issue_button = f"""<tr><td align="center" style="padding:26px 28px 14px;"><a href="{issue_url}" style="display:inline-block;background:#2563eb;border-radius:7px;color:#ffffff;font-size:14px;font-weight:700;padding:12px 20px;text-align:center;text-decoration:none;">Ouvrir le rapport GitHub</a></td></tr>"""

          stats_html = f"""<table role="presentation" width="100%" align="center" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;table-layout:fixed;"><tr>{stat_card(branch_count, "branches non fusionnées", "#2563eb")}{stat_card(pr_count, "PR ouvertes", "#7c3aed")}{stat_card(stale_count, "branches à supprimer", "#d97706")}</tr></table>"""

          html_body = f"""<!doctype html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
          <body style="margin:0;padding:0;background:#f1f5f9;color:#0f172a;font-family:Arial,Helvetica,sans-serif;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#f1f5f9;"><tr><td align="center" style="padding:24px 12px;">
              <table role="presentation" width="680" align="center" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:680px;background:#ffffff;border:1px solid #dbe4f0;border-radius:14px;">
                <tr><td align="center" style="padding:30px 28px;background:#0f172a;color:#ffffff;text-align:center;">
                  <div style="color:#93c5fd;font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;">GitHub Perso Manager</div>
                  <div style="margin-top:9px;font-size:26px;font-weight:700;line-height:32px;">Rapport quotidien</div>
                  <div style="margin-top:8px;color:#cbd5e1;font-size:13px;line-height:19px;">Nouveaux éléments détectés le {text(display_date)}</div>
                </td></tr>
                <tr><td align="center" style="padding:26px 28px 16px;text-align:center;">
                  <div style="color:#0f172a;font-size:20px;font-weight:700;line-height:26px;">Éléments à suivre</div>
                  <div style="margin:8px auto 20px;color:#64748b;font-size:13px;line-height:19px;max-width:500px;">Seuls les nouveaux éléments depuis le dernier état sont inclus dans ce rapport.</div>
                  {stats_html}
                </td></tr>
                {sections}
                {issue_button}
                <tr><td align="center" style="padding:18px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;color:#64748b;font-size:11px;line-height:16px;text-align:center;">Les auteurs et objets de branches sont déduits de la PR ouverte ou du dernier commit.<br>Message généré automatiquement par GitHub Perso Manager.</td></tr>
              </table>
            </td></tr></table>
          </body></html>"""

          summary_parts = []
          if branch_count:
              summary_parts.append(f"{branch_count} branche(s) non fusionnée(s)")
          if pr_count:
              summary_parts.append(f"{pr_count} PR ouverte(s)")
          if stale_count:
              summary_parts.append(f"{stale_count} branche(s) à supprimer")
          subject = "[GitHub] Rapport quotidien — " + ", ".join(summary_parts)

          plain_lines = ["GitHub Perso Manager", f"Rapport quotidien du {display_date}", ""]
          if branches:
              plain_lines.extend(["BRANCHES NON FUSIONNÉES"] + [f"- {item.get('repo')} / {item.get('branch')} — {item.get('owner')} — {item.get('purpose')}" for item in branches] + [""])
          if open_prs:
              plain_lines.extend(["PULL REQUESTS OUVERTES"] + [f"- {item.get('repo')} — PR #{item.get('number')}: {item.get('title')} ({item.get('author')}) — {item.get('url')}" for item in open_prs] + [""])
          if stale_branches:
              plain_lines.extend(["BRANCHES FUSIONNÉES À SUPPRIMER"] + [f"- {item.get('repo')} / {item.get('head_branch')} — PR #{item.get('number')}: {item.get('title')}" for item in stale_branches] + [""])
          if report.get("issue_url"):
              plain_lines.append(f"Ouvrir le rapport GitHub : {report['issue_url']}")
          plain_body = "\n".join(plain_lines)

          message = EmailMessage()
          message["Subject"] = subject
          message["From"] = f"GitHub Perso Manager <{recipient}>"
          message["To"] = recipient
          message.set_content(plain_body, charset="utf-8")
          message.add_alternative(html_body, subtype="html", charset="utf-8")

          try:
              context = ssl.create_default_context()
              with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context, timeout=30) as smtp:
                  smtp.login(recipient, password)
                  smtp.send_message(message)
          except smtplib.SMTPAuthenticationError:
              raise SystemExit("Gmail SMTP authentication failed. Check the App Password secret and Google account settings.")
          except (smtplib.SMTPException, OSError):
              raise SystemExit("Gmail SMTP delivery failed. Check Gmail availability and account policy.")
          PY

      - name: Push updated state to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp state.json /tmp/state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout data
            git pull origin data
          else
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          fi

          cp /tmp/state.json state.json
          git add state.json
          git diff --cached --quiet || git commit -m "Update state $(date -u +%Y-%m-%d)"
          git push origin data
